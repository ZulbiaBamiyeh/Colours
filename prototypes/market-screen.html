<title>Day 4 Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=Almendra:wght@400;700&display=swap">
<style>
  /* Layout: game screen. Top bar, then equipment | market + bag + resonance | inspector. Two columns on tablets, one on phones. */
  :root {
    --night: #14111a;
    --night-2: #211b27;
    --leather: #2a2119;
    --leather-2: #33291f;
    --brass: #c09450;
    --brass-dim: #6e5532;
    --slot: #392f24;
    --slot-in: #4a3d2e;
    --slot-dark: #1b1611;
    --slot-hi: #5b4a36;
    --parch: #f1e6cc;
    --parch-dim: #c0ad8c;
    --parch-faint: #8c7b60;
    --gold: #f4c652;
    --gold-deep: #9a6a12;
    --ember: #e8743b;
    --ember-deep: #a8441a;
    --danger: #e06d6d;
    --r-common: #ddd6c6;
    --r-rare: #78b8ff;
    --r-epic: #cc95ff;
    --s-fire: #ef7a3c;
    --s-frost: #7fcaf0;
    --s-venom: #93c95a;
    --s-desert: #dbb470;
    --s-holy: #f2d67c;
    --s-blood: #db4d63;
    --s-fortune: #4fc79c;
    --s-prism: #e58cff;
    --font-display: "Almendra", "Palatino Linotype", Georgia, serif;
    --font-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
    --slot-size: clamp(46px, 7.2vh, 64px);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--night); }
  body {
    background:
      radial-gradient(1200px 600px at 20% -10%, rgba(232, 116, 59, 0.12), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(127, 202, 240, 0.07), transparent 60%),
      linear-gradient(var(--night-2), var(--night) 480px);
    color: var(--parch);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.45;
  }
  body.dragging, body.dragging * { cursor: grabbing !important; }
  button { font: inherit; color: inherit; }
  h2, p { margin: 0; }

  html, body { height: 100%; }
  .screen {
    max-width: 1380px;
    margin: 0 auto;
    min-height: 100%;
    padding-inline: 16px;
    padding-block: 12px;
    display: grid;
    gap: 12px;
    grid-template-columns: 380px minmax(0, 1fr) 320px;
    grid-template-rows: auto minmax(0, 1fr);
  }
  .stack { display: grid; gap: 12px; align-content: start; min-width: 0; }
  .stack-a { align-content: stretch; }
  .sheet-close { display: none; }
  @media (max-width: 1200px) {
    .screen { grid-template-columns: 380px minmax(0, 1fr); }
    .stack-c {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 40;
      width: min(560px, 100%);
      transform: translate(-50%, 105%);
      visibility: hidden;
      transition: transform 0.25s ease, visibility 0s linear 0.25s;
    }
    .stack-c.open { transform: translate(-50%, 0); visibility: visible; transition: transform 0.25s ease; }
    .inspect {
      grid-template-columns: minmax(0, 200px) minmax(0, 1fr);
      column-gap: 18px;
      border-radius: 14px 14px 0 0;
      max-height: 85vh;
      overflow: auto;
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      box-shadow: 0 -14px 40px rgba(0, 0, 0, 0.65);
    }
    .inspect .ph { grid-column: 1 / -1; }
    .sheet-close { display: grid; }
    .market-foot { display: none; }
  }
  @media (max-width: 800px) {
    :root { --slot-size: 42px; }
    .doll .col { gap: 6px; }
    .screen { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; gap: 10px; }
    .stack-a, .stack-b { display: contents; }
    .equip { order: 1; }
    .market { order: 2; }
    .bag { order: 3; }
  }
  @media (max-width: 480px) {
    .inspect { grid-template-columns: minmax(0, 1fr); }
  }

  /* ---------- Panels ---------- */
  .panel {
    position: relative;
    min-width: 0;
    background: linear-gradient(180deg, var(--leather-2), var(--leather));
    border: 1px solid var(--brass-dim);
    border-radius: 12px;
    padding: 12px 14px 14px;
    box-shadow:
      inset 0 1px 0 rgba(255, 228, 176, 0.09),
      inset 0 0 0 1px rgba(0, 0, 0, 0.35),
      0 14px 30px rgba(0, 0, 0, 0.45);
  }
  .panel::before {
    content: "";
    position: absolute;
    left: 18px;
    right: 18px;
    top: -1px;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--brass), transparent);
    opacity: 0.7;
  }
  .ph { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; min-width: 0; }
  .ph h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; line-height: 1.1; letter-spacing: 0.01em; }
  .ph .rule { flex: 1; height: 1px; background: linear-gradient(90deg, var(--brass-dim), transparent); min-width: 12px; }
  .ph .aside { font-size: 0.875rem; color: var(--parch-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- Top bar ---------- */
  .top {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 28px;
    padding: 8px 16px;
  }
  .brand { display: grid; line-height: 1; gap: 4px; }
  .brand .day { font-family: var(--font-display); font-weight: 700; font-size: 1.65rem; color: var(--gold); text-shadow: 0 2px 0 rgba(0, 0, 0, 0.5); }
  .brand .sub { font-size: 0.8125rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--parch-faint); }
  .meters { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; flex: 1; min-width: 0; }
  .meter { display: grid; gap: 3px; }
  .meter .cap { font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--parch-faint); }
  .meter .val { display: flex; align-items: center; gap: 7px; }
  .meter .num { font-weight: 800; font-size: 1.375rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .gold-num { color: var(--gold); }
  .gold-num.bump { animation: bump 0.35s ease; }
  @keyframes bump { 40% { transform: scale(1.18); } }
  .hearts { display: flex; gap: 3px; }
  .hearts svg { width: 20px; height: 20px; }
  .wins-track { display: flex; gap: 4px; align-items: center; }
  .wins-track i { width: 10px; height: 10px; transform: rotate(45deg); border-radius: 2px; background: #1a140f; box-shadow: inset 0 0 0 1px var(--brass-dim); }
  .wins-track i.on { background: var(--gold); box-shadow: 0 0 6px rgba(244, 198, 82, 0.6); }
  .fight-wrap { display: grid; justify-items: end; gap: 4px; margin-left: auto; }
  .fight {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.2rem;
    padding: 7px 28px;
    background: linear-gradient(#f39257, #cf5521);
    color: #fff6e8;
    border: 1px solid #ffb07c;
    border-radius: 9px;
    box-shadow: 0 4px 0 #6f2a0b, 0 10px 22px rgba(232, 116, 59, 0.35);
    cursor: pointer;
    text-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
  }
  .fight:hover { filter: brightness(1.06); }
  .fight:active { transform: translateY(3px); box-shadow: 0 1px 0 #6f2a0b, 0 6px 14px rgba(232, 116, 59, 0.3); }
  .fight-sub { font-size: 0.8125rem; color: var(--parch-faint); }
  @media (max-width: 640px) {
    .top { display: grid; grid-template-columns: minmax(0, 1fr) auto; }
    .meters { grid-column: 1 / -1; order: 3; }
    .fight-wrap { margin-left: 0; }
    .fight-sub, .meter .wins-track { display: none; }
    .meters { flex-wrap: nowrap; gap: 18px; }
    .meter .num { font-size: 1.15rem; }
    .hearts svg { width: 17px; height: 17px; }
    .brand .day { font-size: 1.4rem; }
  }

  /* ---------- Slots and items ---------- */
  .slot {
    position: relative;
    width: var(--slot-size);
    height: var(--slot-size);
    flex: none;
    border-radius: 8px;
    background: radial-gradient(circle at 50% 38%, var(--slot-in), var(--slot) 72%);
    box-shadow: inset 2px 2px 0 var(--slot-dark), inset -2px -2px 0 var(--slot-hi), 0 0 0 1px #0c0907;
    display: grid;
    place-items: center;
    transition: box-shadow 0.15s ease;
  }
  .slot .glyph { width: 52%; height: 52%; color: var(--parch-faint); opacity: 0.4; }
  .slot.can-drop { box-shadow: inset 2px 2px 0 var(--slot-dark), inset -2px -2px 0 var(--slot-hi), 0 0 0 2px rgba(244, 198, 82, 0.45); }
  .slot.over { box-shadow: inset 2px 2px 0 var(--slot-dark), inset -2px -2px 0 var(--slot-hi), 0 0 0 2px var(--gold), 0 0 18px rgba(244, 198, 82, 0.55); }
  .item {
    position: absolute;
    inset: 0;
    border: 0;
    padding: 0;
    margin: 0;
    background: none;
    border-radius: 8px;
    cursor: grab;
    touch-action: none;
  }
  .item img { width: 100%; height: 100%; display: block; pointer-events: none; -webkit-user-drag: none; user-select: none; }
  .item::after {
    content: "";
    position: absolute;
    left: 22%;
    right: 22%;
    bottom: 5px;
    height: 2px;
    border-radius: 2px;
    background: var(--rc);
    opacity: 0.85;
  }
  .item.r-common { --rc: var(--r-common); }
  .item.r-rare { --rc: var(--r-rare); }
  .item.r-epic { --rc: var(--r-epic); }
  .item:hover { background: rgba(255, 228, 176, 0.06); }
  .item.sel { box-shadow: 0 0 0 2px var(--gold), 0 0 16px rgba(244, 198, 82, 0.45); }
  .item:focus-visible, .btn:focus-visible, .lock:focus-visible, .fight:focus-visible, .seg button:focus-visible, .reroll:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }
  .item.pop { animation: pop 0.35s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes pop { from { transform: scale(0.6); } }
  .dragging-src { opacity: 0.25; }

  /* ---------- Equipment ---------- */
  .equip { display: flex; flex-direction: column; }
  .doll { flex: 1; min-height: 0; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; }
  .doll .col { display: grid; gap: 8px; align-content: start; }
  .stage {
    position: relative;
    min-height: calc(var(--slot-size) * 5 + 32px);
    border-radius: 10px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 70% 45% at 50% 78%, rgba(244, 198, 82, 0.2), transparent 70%),
      radial-gradient(ellipse 90% 70% at 50% 30%, rgba(127, 202, 240, 0.08), transparent 70%),
      linear-gradient(#271f17, #15100c);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.65), inset 0 0 40px rgba(0, 0, 0, 0.55);
  }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  .stage .hint { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 0.75rem; color: var(--parch-faint); pointer-events: none; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
  .stat { background: rgba(0, 0, 0, 0.22); border: 1px solid rgba(255, 228, 176, 0.07); border-radius: 8px; padding: 7px 8px; display: grid; gap: 1px; min-width: 0; }
  .stat .k { font-size: 0.6875rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--parch-faint); }
  .stat .v { font-weight: 800; font-size: 1.0625rem; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Market ---------- */
  .reroll {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 8px;
    background: linear-gradient(#4a3c2c, #362b20);
    border: 1px solid var(--brass-dim);
    color: var(--parch);
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .reroll:hover { border-color: var(--brass); }
  .reroll svg { width: 18px; height: 18px; }
  .offers { container-type: inline-size; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .offer {
    position: relative;
    display: grid;
    justify-items: center;
    align-content: start;
    gap: 7px;
    padding: 30px 6px 12px;
    border-radius: 10px;
    background: linear-gradient(#3b2f23, #2a2119);
    border: 1px solid #4e3f2d;
    text-align: center;
    min-width: 0;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .offer:hover { border-color: #6b5639; }
  .offer.locked { border-color: rgba(244, 198, 82, 0.6); box-shadow: inset 0 0 0 1px rgba(244, 198, 82, 0.15); }
  .offer .slot { --slot-size: clamp(42px, calc(20cqw - 26px), 74px); }
  .o-name { font-weight: 800; font-size: 0.9875rem; line-height: 1.15; min-height: 2.3em; display: grid; align-items: center; }
  .o-name.r-common { color: var(--r-common); }
  .o-name.r-rare { color: var(--r-rare); }
  .o-name.r-epic { color: var(--r-epic); }
  .o-meta { font-size: 0.8125rem; color: var(--parch-dim); display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--sc); box-shadow: 0 0 6px var(--sc); flex: none; display: inline-block; }
  .price {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 10px 2px 5px;
    border-radius: 999px;
    background: #1a140f;
    border: 1px solid #4e3f2d;
    font-weight: 800;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
  }
  .price.short { color: var(--danger); }
  .price svg { width: 18px; height: 18px; }
  .lock {
    position: absolute;
    z-index: 2;
    top: 4px;
    right: 4px;
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    border-radius: 7px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--parch-faint);
    cursor: pointer;
  }
  .lock:hover { color: var(--parch); }
  .lock[aria-pressed="true"] { color: var(--gold); background: rgba(244, 198, 82, 0.12); border-color: rgba(244, 198, 82, 0.4); }
  .lock svg { width: 16px; height: 16px; }
  .offer.sold .slot { opacity: 0.35; }
  .sold-tag { font-family: var(--font-display); font-weight: 700; color: var(--parch-faint); font-size: 1.05rem; min-height: 2.3em; display: grid; align-items: center; }
  .market-foot { margin-top: 10px; font-size: 0.875rem; color: var(--parch-faint); }
  @media (max-width: 520px) {
    .offers { gap: 6px; }
    .offer { padding: 20px 3px 7px; gap: 4px; }
    .o-name { font-size: 0.75rem; }
    .o-meta { display: none; }
    .price { padding: 1px 7px 1px 3px; font-size: 0.875rem; }
    .price svg { width: 14px; height: 14px; }
    .lock { width: 22px; height: 22px; top: 2px; right: 2px; }
    .lock svg { width: 13px; height: 13px; }
    .sellzone { display: none; }
    .stat { padding: 5px 7px; }
    .stat .v { font-size: 0.9375rem; }
  }

  /* ---------- Bag ---------- */
  .bag-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
  .sellzone {
    flex: 1 1 150px;
    min-height: var(--slot-size);
    border: 1.5px dashed var(--brass-dim);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 6px 12px;
    color: var(--parch-faint);
    font-size: 0.875rem;
    text-align: center;
    transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .sellzone svg { width: 22px; height: 22px; flex: none; }
  .sellzone.can-drop { border-color: var(--brass); color: var(--parch-dim); }
  .sellzone.over { border-color: var(--gold); color: var(--gold); background: rgba(244, 198, 82, 0.08); }

  /* ---------- Resonance ---------- */
  .res-list { display: grid; }
  .res-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 2px 14px;
    align-items: center;
    padding: 7px 0;
    border-top: 1px solid rgba(255, 228, 176, 0.06);
  }
  .res-row:first-child { border-top: 0; }
  .res-row.off { opacity: 0.42; }
  .res-name { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .pips { display: flex; align-items: center; gap: 4px; }
  .pip { width: 11px; height: 11px; transform: rotate(45deg); border-radius: 2px; background: #1a140f; box-shadow: inset 0 0 0 1px #4e3f2d; }
  .pip.on { background: var(--sc); box-shadow: 0 0 7px var(--sc); }
  .pip.gap { margin-right: 7px; }
  .res-text { grid-column: 1 / -1; font-size: 0.875rem; color: var(--parch-faint); min-width: 0; }
  .res-row.off .res-text { display: none; }
  .res-row.active .res-text { color: var(--parch); }
  .res-text b { color: var(--sc); font-weight: 800; }

  /* ---------- Inspector ---------- */
  .inspect { display: grid; gap: 14px; align-content: start; }
  .inspect .ph { margin-bottom: 0; }
  .tt-wrap { position: relative; display: grid; justify-items: center; gap: 8px; }
  #turntable {
    width: min(100%, 288px, 30vh);
    aspect-ratio: 1;
    border-radius: 12px;
    background: radial-gradient(circle at 50% 42%, #4d3f2f, #2a2119 72%);
    box-shadow: inset 0 0 0 1px #0c0907, inset 0 0 44px rgba(0, 0, 0, 0.55);
  }
  #turntable.pixel { image-rendering: pixelated; }
  .seg { display: inline-flex; border: 1px solid var(--brass-dim); border-radius: 8px; overflow: hidden; }
  .seg button { padding: 4px 12px; border: 0; border-right: 1px solid var(--brass-dim); background: #221a13; color: var(--parch-dim); cursor: pointer; font-size: 0.875rem; }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--brass); color: #22180e; font-weight: 800; }
  .sheet-close {
    width: 32px;
    height: 32px;
    place-items: center;
    border-radius: 8px;
    border: 1px solid var(--brass-dim);
    background: #221a13;
    color: var(--parch);
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
  }
  .ins-body { display: grid; gap: 14px; align-content: start; min-width: 0; }
  .card { display: grid; gap: 6px; min-width: 0; }
  .c-name { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; line-height: 1.1; }
  .c-name.r-common { color: var(--r-common); }
  .c-name.r-rare { color: var(--r-rare); }
  .c-name.r-epic { color: var(--r-epic); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; border: 1px solid rgba(255, 228, 176, 0.14); background: rgba(0, 0, 0, 0.2); font-size: 0.8125rem; color: var(--parch-dim); }
  .c-stats { font-variant-numeric: tabular-nums; color: var(--parch-dim); }
  .c-effect { line-height: 1.5; }
  .c-value { font-size: 0.875rem; color: var(--parch-faint); }
  .c-empty { color: var(--parch-faint); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--brass-dim);
    background: linear-gradient(#45382a, #33291f);
    color: var(--parch);
    font-weight: 700;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--brass); }
  .btn.primary { background: linear-gradient(#f6d16c, #d79a26); color: #2a1906; border-color: #ffe39a; box-shadow: 0 3px 0 var(--gold-deep); }
  .btn.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--gold-deep); }
  .btn[aria-disabled="true"] { opacity: 0.55; }
  .btn svg { width: 16px; height: 16px; }
  .shortcuts { font-size: 0.8125rem; color: var(--parch-faint); }

  /* ---------- Floating bits ---------- */
  .tip {
    position: fixed;
    z-index: 50;
    width: 250px;
    pointer-events: none;
    background: rgba(17, 12, 8, 0.97);
    border: 1px solid var(--brass-dim);
    border-radius: 9px;
    padding: 10px 12px;
    box-shadow: 0 12px 26px rgba(0, 0, 0, 0.55);
    display: grid;
    gap: 3px;
    font-size: 0.875rem;
  }
  .tip[hidden] { display: none; }
  .tip .t-name { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; }
  .tip .t-name.r-common { color: var(--r-common); }
  .tip .t-name.r-rare { color: var(--r-rare); }
  .tip .t-name.r-epic { color: var(--r-epic); }
  .tip .t-meta { color: var(--parch-faint); }
  .ghost { position: fixed; z-index: 60; width: 76px; height: 76px; pointer-events: none; transform: translate(-50%, -50%) scale(1.08); filter: drop-shadow(0 10px 10px rgba(0, 0, 0, 0.6)); }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));

<script type="module">
import * as THREE from 'three';

/* =========================================================
   Materials
   ========================================================= */
const TOON = (() => {
  const t = new THREE.DataTexture(new Uint8Array([70, 165, 255]), 3, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
})();

function materialFactory(style) {
  const m = (hex, o = {}) => {
    const glow = o.glow || 0;
    if (style === 'pixel') {
      return new THREE.MeshToonMaterial({
        color: hex, gradientMap: TOON, vertexColors: !!o.vc,
        emissive: glow ? hex : 0x000000, emissiveIntensity: glow * 0.8,
      });
    }
    const c = new THREE.Color(hex);
    const hsl = {};
    c.getHSL(hsl, THREE.SRGBColorSpace);
    c.setHSL(hsl.h, hsl.s * 0.55, Math.min(1, hsl.l * 0.88 + 0.02), THREE.SRGBColorSpace);
    return new THREE.MeshLambertMaterial({
      color: c, flatShading: true, vertexColors: !!o.vc,
      emissive: glow ? c : 0x000000, emissiveIntensity: glow * 0.45,
    });
  };
  m.style = style;
  return m;
}
const MS = materialFactory('smooth');
const hslHex = (h, s, l) => new THREE.Color().setHSL(h, s, l, THREE.SRGBColorSpace).getHex(THREE.SRGBColorSpace);

/* =========================================================
   Geometry helpers
   ========================================================= */
function mesh(geo, mat, p = [0, 0, 0], r = [0, 0, 0], s = null) {
  const o = new THREE.Mesh(geo, mat);
  o.position.set(...p);
  o.rotation.set(...r);
  if (s) o.scale.set(...s);
  return o;
}
function extrude(shape, depth, bevel = 0.015) {
  const g = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 1, curveSegments: 8,
  });
  g.translate(0, 0, -depth / 2);
  return g;
}
function shapeFrom(points, sx = 1) {
  const sh = new THREE.Shape();
  sh.moveTo(points[0][0] * sx, points[0][1]);
  for (let i = 1; i < points.length; i++) sh.lineTo(points[i][0] * sx, points[i][1]);
  sh.closePath();
  return sh;
}
const WING = [[0, 0], [0.16, 0.06], [0.34, 0.2], [0.5, 0.48], [0.37, 0.37], [0.43, 0.27], [0.29, 0.23], [0.31, 0.13], [0.15, 0.1]];

function buildCinder(m) {
  const g = new THREE.Group();

  blade.quadraticCurveTo(-0.05, 0.72, -0.11, 0);

  g.add(mesh(extrude(blade, 0.026, 0), m(0xff6a1a, { glow: 0.9 }), [0, 0.03, 0], [0, 0, 0], [1.38, 1.06, 1]));

  g.add(mesh(new THREE.ConeGeometry(0.05, 0.17, 6), m(0xff8a2a, { glow: 0.5 }), [0.28, 0.09, 0], [0, 0, -0.55]));
  g.add(mesh(new THREE.ConeGeometry(0.05, 0.17, 6), m(0xff8a2a, { glow: 0.5 }), [-0.28, 0.09, 0], [0, 0, 0.55]));
  g.add(mesh(new THREE.CylinderGeometry(0.055, 0.062, 0.42, 8), m(0x5c2d1c), [0, -0.24, 0]));
  for (const y of [-0.11, -0.24, -0.37]) {
    g.add(mesh(new THREE.TorusGeometry(0.063, 0.018, 6, 12), m(0x2c1711), [0, y, 0], [Math.PI / 2, 0, 0]));
  }
  g.add(mesh(new THREE.OctahedronGeometry(0.1), m(0xffa31a, { glow: 0.9 }), [0, -0.53, 0], [0, 0, 0], [1, 1.25, 1]));

    const e = mesh(new THREE.TetrahedronGeometry(0.042), m(0xffd04a, { glow: 1 }), p);
    e.userData.base = p.slice();
    g.add(e);
    return e;
  });
  g.userData.anim = t => flick.forEach((e, i) => {
    e.position.y = e.userData.base[1] + Math.sin(t * 2.2 + i * 2) * 0.05;
    e.rotation.set(t * 2 + i, t * 1.5, 0);
  });
  return g;
}

function buildMaul(m) {

  g.add(mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.12, 8), trim, [0, 0.76, 0]));
  g.add(mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.78, 10), m(0x6a7a99), [0, 1.0, 0], [0, 0, Math.PI / 2]));

function buildRing(m) {
  const g = new THREE.Group();
  const gold = m(0xe9b23b);
  g.add(mesh(new THREE.TorusGeometry(0.52, 0.1, 8, 28), gold));

}

function buildHalo(m) {

function buildPrism(m) {

  };

}

};

   Actions
   ========================================================= */
function pay(n) {
  if (S.gold < n) { toast(`You need ${n} gold and have ${S.gold}.`); return false; }
  S.gold -= n;
  bumpGold();
  return true;
}

function placeEquip(item, slot, srcBag) {
  const it = ITEMS[item.id];
  const displaced = [];
  if (S.equip[slot]) displaced.push(S.equip[slot]);
  if (it.hands === 2 && S.equip.offhand) displaced.push(S.equip.offhand);
  const free = freeBag(srcBag ?? -1);
  const room = free.length + (srcBag != null ? 1 : 0);
  if (displaced.length > room) { toast('Your bag is full. Sell something first.'); return false; }
  if (srcBag != null) S.bag[srcBag] = null;
  S.equip[slot] = item;
  if (it.hands === 2) S.equip.offhand = null;
  displaced.forEach((d, i) => {
    if (i === 0 && srcBag != null) S.bag[srcBag] = d;
    else S.bag[free.shift()] = d;
  });
  return true;
}

function defaultSlot(id) {
  const it = ITEMS[id];
  if (it.slot !== 'ring') return it.slot;
  return !S.equip.ring1 ? 'ring1' : !S.equip.ring2 ? 'ring2' : 'ring1';
}

function buy(i, dest) {
  const o = S.shop[i];
  if (!o || o.sold) return;
  const it = ITEMS[o.id];
  let target = dest;
  if (!target) {
    const b = freeBag();
    if (!b.length) {
      if (S.gold < it.price) return toast(`You need ${it.price} gold and have ${S.gold}.`);
      return toast('Your bag is full. Sell or equip something first.');
    }
    target = { where: 'bag', key: b[0] };
  }
  if (target.where === 'bag' && S.bag[target.key]) return toast('That bag slot is taken.');
  if (target.where === 'equip' && !fits(o.id, target.key)) return toast(`${it.name} goes in the ${slotLabel(o.id).toLowerCase()} slot.`);
  if (S.gold < it.price) return toast(`You need ${it.price} gold and have ${S.gold}.`);
  const item = { uid: o.uid, id: o.id };
  if (target.where === 'equip') {
    if (!placeEquip(item, target.key, null)) return;
  } else {
    S.bag[target.key] = item;
  }
  pay(it.price);
  o.sold = true;
  S.sel = `${target.where}:${target.key}`;
  freshUid = item.uid;
  toast(`Bought ${it.name} for ${it.price} gold.`);
  commit();
}

function equipFrom(loc, slot) {
  const item = getItem(loc);
  if (!item) return;
  const it = ITEMS[item.id];
  slot = slot || defaultSlot(item.id);
  if (!fits(item.id, slot)) return toast(`${it.name} goes in the ${slotLabel(item.id).toLowerCase()} slot.`);
  const [w, k] = loc.split(':');
  if (w === 'equip') {
    if (k === slot) return;
    const other = S.equip[slot];
    S.equip[slot] = item;
    S.equip[k] = other;
  } else if (w === 'bag') {
    if (!placeEquip(item, slot, +k)) return;
  }
  S.sel = `equip:${slot}`;
  freshUid = item.uid;
  commit();
}

function unequip(slot, bagIndex) {
  const item = S.equip[slot];
  if (!item) return;
  let target = bagIndex;
  if (target == null) {
    const free = freeBag();
    if (!free.length) return toast('Your bag is full. Sell something first.');
    target = free[0];
  }
  const occupant = S.bag[target];
  if (occupant) {
    if (!fits(occupant.id, slot)) return toast('That bag slot is taken.');
    S.equip[slot] = occupant;
    freshUid = occupant.uid;
  } else {
    S.equip[slot] = null;
  }
  S.bag[target] = item;
  S.sel = `bag:${target}`;
  commit();
}

function sell(loc) {
  const item = getItem(loc);
  if (!item) return;
  const [w, k] = loc.split(':');
  if (w === 'shop') return;
  const v = sellValue(item.id);
  if (w === 'bag') S.bag[+k] = null;
  else S.equip[k] = null;
  S.gold += v;
  bumpGold();
  if (S.sel === loc) S.sel = null;
  toast(`Sold ${ITEMS[item.id].name} for ${v} gold.`);
  commit();
}

function swapBag(a, b) {
  if (a === b) return;
  [S.bag[a], S.bag[b]] = [S.bag[b], S.bag[a]];
  S.sel = `bag:${b}`;
  commit();
}

function rollId() {
  const total = POOL.reduce((s, [, w]) => s + w, 0);
  let r = Math.random() * total;
  for (const [id, w] of POOL) { if ((r -= w) < 0) return id; }
  return POOL[0][0];
}
function reroll() {
  if (!pay(1)) return;
  S.shop = S.shop.map(o => (o.locked ? o : { ...inst(rollId()), locked: false, sold: false }));
  if (S.sel?.startsWith('shop:')) S.sel = null;
  toast('New offers in the market.');
  commit();
}
function toggleLock(i) {
  const o = S.shop[i];
  o.locked = !o.locked;
  commit();
}

function quick(loc) {
  const [w, k] = loc.split(':');
  if (w === 'shop') return;
  if (w === 'bag') equipFrom(loc);
  else unequip(k);
}

function canDrop(from, target) {
  const item = getItem(from);
  if (!item) return false;
  const [fw, fk] = from.split(':');
  const [tw, tk] = target.split(':');
  if (tw === 'sell') return fw !== 'shop';
  if (tw === 'equip') {
    if (!fits(item.id, tk)) return false;
    return !(fw === 'equip' && fk === tk);
  }
  if (tw === 'bag') {
    if (fw === 'shop') return !S.bag[+tk];
    if (fw === 'bag') return fk !== tk;
    const occ = S.bag[+tk];
    return !occ || fits(occ.id, fk);
  }
  return false;
}
function drop(from, target) {
  const [fw, fk] = from.split(':');
  const [tw, tk] = target.split(':');
  if (tw === 'sell') return sell(from);
  if (fw === 'shop') return buy(+fk, { where: tw, key: tw === 'bag' ? +tk : tk });
  if (tw === 'equip') return equipFrom(from, tk);
  if (tw === 'bag') return fw === 'bag' ? swapBag(+fk, +tk) : unequip(fk, +tk);
}

function eachVertex(root, fn) {
  root.updateMatrixWorld(true);
  root.traverse(o => {
    if (!o.isMesh) return;
    const pos = o.geometry.attributes.position;

function makeRig(style, id) {

  poser.rotation.set(...item.pose);
  const model = item.build(materialFactory(style));

  poser.add(model);
  spinner.add(poser);

  const box = new THREE.Box3();
  eachVertex(spinner, v => box.expandByPoint(v));
  model.position.sub(box.getCenter(new THREE.Vector3()).applyQuaternion(poser.quaternion.clone().invert()));
  let radius = 0;
  eachVertex(spinner, v => { radius = Math.max(radius, v.length()); });
  spinner.rotation.y = item.yaw;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  eachVertex(spinner, v => {

    y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y);
  });
  return {
    item, scene, spinner, model,
    iconFrame: { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, half: Math.max(x1 - x0, y1 - y0) / 2 * 1.12 },
    previewFrame: { cx: 0, cy: 0, half: radius * 1.08 },

}

function shoot(renderer, rig, yaw, frame, size, t) {

const scratch = new Map();
function scratchFor(res) {
  if (!scratch.has(res)) {
    const c = document.createElement('canvas');
    c.width = c.height = res;
    scratch.set(res, c.getContext('2d', { willReadFrequently: true }));
  }
  return scratch.get(res);
}
function pixelPost(img, n) {
  const d = img.data;
  for (let i = 3; i < d.length; i += 4) d[i] = d[i] < 110 ? 0 : 255;
  const src = new Uint8ClampedArray(d);
  const at = (x, y) => (x < 0 || y < 0 || x >= n || y >= n) ? -1 : (y * n + x) * 4;
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      const i = at(x, y);
      if (src[i + 3]) continue;
      for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
        const j = at(x + dx, y + dy);
        if (j < 0 || !src[j + 3]) continue;
        d[i] = src[j] * 0.26 + 14;
        d[i + 1] = src[j + 1] * 0.22 + 10;
        d[i + 2] = src[j + 2] * 0.3 + 26;
        d[i + 3] = 255;
        break;
      }
    }
  }
}
function drawPixel(rig, yaw, frame, res, ctx, t) {
  shoot(pxR, rig, yaw, frame, res, t);
  const s = scratchFor(res);
  s.clearRect(0, 0, res, res);
  s.drawImage(pxR.domElement, 0, PX_MAX - res, res, res, 0, 0, res, res);
  const img = s.getImageData(0, 0, res, res);
  pixelPost(img, res);
  s.putImageData(img, 0, 0);
  const W = ctx.canvas.width;
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, W, W);
  ctx.drawImage(s.canvas, 0, 0, res, res, 0, 0, W, W);
}
function drawSmooth(rig, yaw, frame, size, ctx, t) {
  shoot(smR, rig, yaw, frame, size, t);
  const W = ctx.canvas.width;
  ctx.clearRect(0, 0, W, W);
  ctx.save();
  ctx.imageSmoothingEnabled = true;
  ctx.shadowColor = 'rgba(16, 9, 2, 0.6)';
  ctx.shadowOffsetX = ctx.shadowOffsetY = Math.max(2, Math.round(W / 64));
  ctx.drawImage(smR.domElement, 0, SM_MAX - size, size, size, 0, 0, W, W);
  ctx.restore();
}

    aimArm(hero.arms.left, L2H);
  } else {
    hero.arms.right.pivot.rotation.set(-0.5, 0, -0.16);
    hero.arms.left.pivot.rotation.set(0.12, 0, 0.14);
  }
  attach('helm', S.equip.helm, hero.helm, h => {
    h.position.set(0, 0.06, 0);
    h.scale.setScalar(0.78);
  });
  hero.hair.visible = !S.equip.helm;
}

let heroYaw = 0.38;
function sizeHero() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  hr.setSize(w, h, false);
  hc.aspect = w / h;
  const tanH = Math.tan(THREE.MathUtils.degToRad(hc.fov / 2));
  const d = Math.max(1.6 / tanH, 1.05 / (tanH * hc.aspect));
  hc.position.set(0, 1.2 + d * 0.06, d);
  hc.lookAt(0, 1.08, 0);
  hc.updateProjectionMatrix();
}
new ResizeObserver(sizeHero).observe(stage);
{
  let dragX = null;
  heroCanvas.addEventListener('pointerdown', e => { dragX = e.clientX; heroCanvas.setPointerCapture(e.pointerId); });
  heroCanvas.addEventListener('pointermove', e => {
    if (dragX === null) return;
    heroYaw += (e.clientX - dragX) * 0.012;
    dragX = e.clientX;
  });
  const end = () => { dragX = null; };
  heroCanvas.addEventListener('pointerup', end);
  heroCanvas.addEventListener('pointercancel', end);
}

/* =========================================================
   DOM
   ========================================================= */
const $ = id => document.getElementById(id);
const equipCells = {};
for (const [colId, keys] of [['col-left', LEFT], ['col-right', RIGHT]]) {
  const col = $(colId);
  for (const k of keys) {
    const cell = document.createElement('div');
    cell.className = 'slot';
    cell.dataset.drop = `equip:${k}`;
    col.append(cell);
    equipCells[k] = cell;
  }
}
const bagCells = [];
const bagHost = $('bag-cells');
for (let i = 0; i < 6; i++) {
  const cell = document.createElement('div');
  cell.className = 'slot';
  cell.dataset.drop = `bag:${i}`;
  bagHost.append(cell);
  bagCells.push(cell);
}
const offerEls = [];
for (let i = 0; i < 5; i++) {
  const el = document.createElement('div');
  el.className = 'offer';
  $('offers').append(el);
  offerEls.push(el);
}

const glyph = k => `<svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">${GLYPH[k]}</svg>`;
const schoolDot = sc => `<span class="dot" style="--sc: var(${SCHOOL_VAR[sc]})"></span>`;
function itemBtn(item, loc, extraLabel = '') {
  const it = ITEMS[item.id];
  const cls = ['item', `r-${it.rarity}`];
  if (S.sel === loc) cls.push('sel');
  if (item.uid === freshUid) cls.push('pop');
  return `<button type="button" class="${cls.join(' ')}" data-loc="${loc}" aria-label="${it.name}${extraLabel}"><img src="${ICON[item.id]}" alt="" draggable="false"></button>`;
}

function renderTop() {
  $('gold').textContent = S.gold;
  $('lives').innerHTML = Array.from({ length: S.maxLives }, (_, i) => HEART(i < S.lives)).join('');
  $('lives').setAttribute('aria-label', `${S.lives} of ${S.maxLives} lives`);
  $('wins-num').textContent = `${S.wins} / ${S.goal}`;
  $('wins').innerHTML = Array.from({ length: S.goal }, (_, i) => `<i class="${i < S.wins ? 'on' : ''}"></i>`).join('');
}
function renderEquip() {
  for (const k of [...LEFT, ...RIGHT]) {
    const it = S.equip[k];
    equipCells[k].innerHTML = it ? itemBtn(it, `equip:${k}`, `, equipped as ${SLOT_NAME[k]}`) : glyph(k);
    equipCells[k].title = it ? '' : SLOT_NAME[k];
  }
}
function renderBag() {
  bagCells.forEach((cell, i) => { cell.innerHTML = S.bag[i] ? itemBtn(S.bag[i], `bag:${i}`, ', in bag') : ''; });
  $('bag-count').textContent = `${S.bag.filter(Boolean).length} / 6`;
}
function renderShop() {
  S.shop.forEach((o, i) => {
    const el = offerEls[i];
    const it = ITEMS[o.id];
    el.classList.toggle('locked', o.locked);
    el.classList.toggle('sold', o.sold);
    const lockBtn = `<button type="button" class="lock" data-lock="${i}" aria-pressed="${o.locked}" aria-label="${o.locked ? 'Unlock' : 'Lock'} ${it.name}" title="${o.locked ? 'Locked: kept on reroll' : 'Lock to keep on reroll'}">${o.locked ? LOCK : UNLOCK}</button>`;
    if (o.sold) {
      el.innerHTML = `${lockBtn}<div class="slot"></div><div class="sold-tag">Sold</div><div class="o-meta">Reroll for new offers</div>`;
      return;
    }
    el.innerHTML = `${lockBtn}
      <div class="slot">${itemBtn(o, `shop:${i}`, `, ${it.price} gold`)}</div>
      <div class="o-name r-${it.rarity}">${it.name}</div>
      <div class="o-meta">${it.schools.map(sc => `${schoolDot(sc)}${sc}`).join(' ')}</div>
      <div class="price${S.gold < it.price ? ' short' : ''}">${COIN}${it.price}</div>`;
  });
}

function counts() {
  const c = Object.fromEntries([...SCHOOLS, 'Prismatic'].map(s => [s, 0]));
  for (const k of [...LEFT, ...RIGHT]) {
    const item = S.equip[k];
    if (!item) continue;
    for (const sc of ITEMS[item.id].schools) c[sc]++;
  }
  if (c.Prismatic > 0) for (const sc of SCHOOLS) c[sc] += 1;
  return c;
}
function renderRes() {
  const c = counts();
  const rows = SCHOOLS.map(sc => ({ sc, n: c[sc] })).sort((a, b) => b.n - a.n || SCHOOLS.indexOf(a.sc) - SCHOOLS.indexOf(b.sc));
  if (c.Prismatic > 0) rows.push({ sc: 'Prismatic', n: c.Prismatic });
  $('res-list').innerHTML = rows.map(({ sc, n }) => {
    const prism = sc === 'Prismatic';
    const max = prism ? 3 : 6;
    const pips = Array.from({ length: max }, (_, i) => `<span class="pip${i < n ? ' on' : ''}${!prism && (i === 1 || i === 3) ? ' gap' : ''}"></span>`).join('');
    let text;
    if (prism) {
      text = n >= 3 ? '<b>3</b> Random amounts +50%' : `Counts toward every school. <b>3</b> Random amounts +50%`;
    } else {
      const tier = Math.min(3, Math.floor(n / 2));
      text = tier > 0
        ? `<b>${tier * 2}</b> ${RES[sc][tier - 1]}`
        : `<b>2</b> ${RES[sc][0]}`;
    }
    const active = prism ? n >= 3 : n >= 2;
    return `<div class="res-row ${active ? 'active' : n ? '' : 'off'}" style="--sc: var(${SCHOOL_VAR[sc]})">
      <span class="res-name">${schoolDot(sc)}${sc}</span>
      <span class="pips" aria-label="${n} ${sc} item${n === 1 ? '' : 's'}">${pips}</span>
      <span class="res-text">${text}</span>
    </div>`;
  }).join('');
}

function renderStats() {
  const c = counts();
  let hp = 100;
  void c;
  for (const k of [...LEFT, ...RIGHT]) if (S.equip[k]) hp += ITEMS[S.equip[k].id].hp || 0;
  const w = S.equip.weapon && ITEMS[S.equip.weapon.id];
  const tiles = [
    ['HP', hp],
    ['Damage', w ? w.dmg : 1],
    ['Speed', `${w ? w.speed.toFixed(1) : '1.5'}s`],
    ['Crit', '5%'],
  ];
  $('stats').innerHTML = tiles.map(([k, v]) => `<div class="stat"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
}

const card = $('card'), actions = $('actions');
let ttItem = null;
function renderInspector() {
  const loc = S.sel;
  const item = getItem(loc);
  if (!item) {
    document.querySelector('.stack-c')?.classList.remove('open');
    ttItem = null;
    card.innerHTML = '<p class="c-empty">Select an item to inspect it.</p>';
    actions.innerHTML = '';
    return;
  }
  ttItem = item.id;
  const it = ITEMS[item.id];
  const [w, k] = loc.split(':');
  const where = w === 'shop' ? 'In the market' : w === 'bag' ? 'In your bag' : `Equipped · ${SLOT_NAME[k]}`;
  const stats = it.dmg ? `${it.kind} · ${it.speed.toFixed(1)}s · ${it.dmg} dmg` : it.kind;
  const value = w === 'shop' ? `Costs ${it.price} gold` : `Sells for ${sellValue(item.id)} gold`;
  card.innerHTML = `<span class="c-name r-${it.rarity}">${it.name}</span>
    <div class="chips">${it.schools.map(sc => `<span class="chip">${schoolDot(sc)}${sc}</span>`).join('')}<span class="chip">${slotLabel(item.id)}</span><span class="chip">${RARITY[it.rarity]}</span></div>
    <span class="c-stats">${stats}</span>
    <p class="c-effect">${it.effect}</p>
    <span class="c-value">${where} · ${value}</span>`;
  const btn = (act, label, primary, extra = '') => `<button type="button" class="btn${primary ? ' primary' : ''}" data-act="${act}" ${extra}>${label}</button>`;
  if (w === 'shop') {
    const o = S.shop[+k];
    actions.innerHTML = btn('buy', `${COIN.replace('<svg', '<svg width="16" height="16"')}Buy for ${it.price}`, true, S.gold < it.price ? 'aria-disabled="true"' : '')
      + btn('lock', o.locked ? 'Unlock' : 'Lock offer', false);
  } else if (w === 'bag') {
    actions.innerHTML = btn('equip', 'Equip', true) + btn('sell', `Sell for ${sellValue(item.id)}`, false);
  } else {
    actions.innerHTML = btn('unequip', 'Take off', true) + btn('sell', `Sell for ${sellValue(item.id)}`, false);
  }
}

function render() {
  const focusLoc = document.activeElement?.dataset?.loc;
  renderTop();
  renderEquip();
  renderBag();
  renderShop();
  renderStats();
  renderInspector();
  if (focusLoc) document.querySelector(`[data-loc="${focusLoc}"]`)?.focus({ preventScroll: true });
  ttDirty = true;
}
function commit() {
  render();
  refreshHero();
  freshUid = null;
}

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.remove('hide');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hide'), 2600);
}
function bumpGold() {
  const g = $('gold');
  g.classList.remove('bump');
  void g.offsetWidth;
  g.classList.add('bump');
}

/* ---------- Tooltip ---------- */
const tip = $('tip');
function showTip(btn) {
  const item = getItem(btn.dataset.loc);
  if (!item || drag) return;
  const it = ITEMS[item.id];
  const stats = it.dmg ? `${it.kind} · ${it.speed.toFixed(1)}s · ${it.dmg} dmg` : it.kind;
  tip.innerHTML = `<span class="t-name r-${it.rarity}">${it.name}</span>
    <span class="t-meta">${it.schools.join(' · ')} · ${slotLabel(item.id)}</span>
    <span>${stats}</span><span>${it.effect}</span>`;
  tip.hidden = false;
  const r = btn.getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = r.right + 10;
  if (x + tw > window.innerWidth - 8) x = r.left - tw - 10;
  if (x < 8) x = Math.min(window.innerWidth - tw - 8, Math.max(8, r.left));
  let y = r.top;
  if (y + th > window.innerHeight - 8) y = window.innerHeight - th - 8;
  tip.style.left = `${x}px`;
  tip.style.top = `${Math.max(8, y)}px`;
}
const hideTip = () => { tip.hidden = true; };
document.addEventListener('pointerover', e => {
  if (e.pointerType !== 'mouse') return;
  const b = e.target.closest('.item');
  if (b) showTip(b);
});
document.addEventListener('pointerout', e => {
  const b = e.target.closest('.item');
  if (b && !b.contains(e.relatedTarget)) hideTip();
});
window.addEventListener('scroll', hideTip, { passive: true });

/* ---------- Drag and drop ---------- */
let drag = null;
let suppressClick = false;
let lastClick = { loc: null, t: 0 };
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('.item');
  if (!b || e.button > 0) return;
  drag = { loc: b.dataset.loc, btn: b, x: e.clientX, y: e.clientY, active: false, ghost: null, over: null };
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.active) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
    const item = getItem(drag.loc);
    if (!item) { drag = null; return; }
    drag.active = true;
    hideTip();
    document.body.classList.add('dragging');
    drag.btn.classList.add('dragging-src');
    const g = document.createElement('img');
    g.className = 'ghost';
    g.src = ICON[item.id];
    g.alt = '';
    document.body.append(g);
    drag.ghost = g;
    document.querySelectorAll('[data-drop]').forEach(t => {
      if (canDrop(drag.loc, t.dataset.drop) && t.classList.contains('slot')) t.classList.add('can-drop');
    });
    if (canDrop(drag.loc, 'sell')) $('sellzone').classList.add('can-drop');
  }
  e.preventDefault();
  drag.ghost.style.left = `${e.clientX}px`;
  drag.ghost.style.top = `${e.clientY}px`;
  const under = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-drop]');
  const target = under && canDrop(drag.loc, under.dataset.drop) ? under : null;
  const overEl = target && target.dataset.drop === 'sell' ? $('sellzone') : target;
  if (drag.over !== overEl) {
    drag.over?.classList.remove('over');
    overEl?.classList.add('over');
    drag.over = overEl;
    drag.target = target?.dataset.drop || null;
  }
}, { passive: false });
function endDrag(e, cancelled) {
  if (!drag) return;
  const d = drag;
  drag = null;
  if (!d.active) return;
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 0);
  d.ghost?.remove();
  document.body.classList.remove('dragging');
  document.querySelectorAll('.can-drop, .over').forEach(el => el.classList.remove('can-drop', 'over'));
  d.btn.classList.remove('dragging-src');
  if (!cancelled && d.target) drop(d.loc, d.target);
}
window.addEventListener('pointerup', e => endDrag(e, false));
window.addEventListener('pointercancel', e => endDrag(e, true));

/* ---------- Clicks ---------- */
document.addEventListener('click', e => {
  if (suppressClick) return;
  const lock = e.target.closest('[data-lock]');
  if (lock) { toggleLock(+lock.dataset.lock); return; }
  const b = e.target.closest('.item');
  if (b) {
    const now = performance.now();
    const loc = b.dataset.loc;
    if (lastClick.loc === loc && now - lastClick.t < 400) {
      lastClick.loc = null;
      quick(loc);
      return;
    }
    lastClick = { loc, t: now };
    S.sel = loc;
    render();
    openSheet();
    return;
  }
  const a = e.target.closest('[data-act]');
  if (a) {
    const loc = S.sel;
    const [, k] = loc.split(':');
    const act = a.dataset.act;
    if (act === 'buy') buy(+k);
    else if (act === 'lock') toggleLock(+k);
    else if (act === 'equip') equipFrom(loc);
    else if (act === 'unequip') unequip(k);
    else if (act === 'sell') sell(loc);
  }
});
$('reroll').addEventListener('click', reroll);
const sheet = document.querySelector('.stack-c');
const sheetMQ = window.matchMedia('(max-width: 1200px)');
function openSheet() { if (sheetMQ.matches) sheet.classList.add('open'); }
function closeSheet() { sheet.classList.remove('open'); }
$('sheet-close').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
$('fight').addEventListener('click', () => toast('The fight screen is the next step. This demo covers the market.'));
const tt = $('turntable');
const ttCtx = tt.getContext('2d');
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  S.ttStyle = b.dataset.v;
  syncSeg();
  ttDirty = true;
}));
function syncSeg() {
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.ttStyle)));
  tt.classList.toggle('pixel', S.ttStyle === 'pixel');
}

/* =========================================================
   Loop
   ========================================================= */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let ttDirty = true, ttYaw = 0, t = 0, last = performance.now();
function drawTurntable() {
  if (!ttItem) { ttCtx.clearRect(0, 0, tt.width, tt.height); return; }
  const rig = rigs[S.ttStyle][ttItem];
  const yaw = rig.item.yaw + ttYaw;
  if (S.ttStyle === 'pixel') drawPixel(rig, yaw, rig.previewFrame, 64, ttCtx, t);
  else drawSmooth(rig, yaw, rig.previewFrame, SM_MAX, ttCtx, t);
}
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (!reduceMotion) { t += dt; ttYaw += dt * 0.8; ttDirty = true; }
  if (ttDirty) { drawTurntable(); ttDirty = false; }

  const bob = reduceMotion ? 0 : Math.sin(t * 2.2);
  hero.body.position.y = bob * 0.018;
  if (!twoHanded) {
    hero.arms.right.pivot.rotation.x = -0.5 + bob * 0.03;
    hero.arms.left.pivot.rotation.x = 0.12 - bob * 0.04;
  }
  hero.head.rotation.z = reduceMotion ? 0 : Math.sin(t * 1.1) * 0.035;
  hero.root.rotation.y += (heroYaw - hero.root.rotation.y) * 0.18;
  for (const w of Object.values(worn)) {
    if (!w) continue;
    w.model.userData.anim?.(t);
    const h = w.holder;
    if (h.userData.pop < 1) {
      h.userData.pop = Math.min(1, h.userData.pop + dt * 3.2);
      const p = h.userData.pop;
      const k = reduceMotion ? 1 : 1 + Math.sin(p * Math.PI) * 0.35 * (1 - p) - (1 - p) * 0.6;
      h.scale.setScalar(h.userData.base * Math.max(0.05, k));
    }
  }
  hr.render(hs, hc);
  requestAnimationFrame(loop);
}

syncSeg();
render();
refreshHero();
sizeHero();
requestAnimationFrame(loop);
</script>
